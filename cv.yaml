coursework:
  - it: "**Produzione e lavorazioni:** Digital Manufacturing (CNC, G-code, sistemi multi-agente), Precision Engineering, Materiali e Metallurgia, Meccanica."
    en: "**Manufacturing & machining:** Digital Manufacturing (CNC, G-code, multi-agent systems), Precision Engineering, Materials and Metallurgy, Mechanics."
  - it: "**Misure, segnali e dati:** Digital Signal Processing, Misure Meccaniche e Termiche, Analisi dei Dati e Statistica."
    en: "**Measurements, signals & data:** Digital Signal Processing, Mechanical and Thermal Measurements, Data Analysis and Statistics."
  - it: "**Azionamenti elettrici ed energia:** Electric Drives for the Energy Transition (macchine elettriche e loro controllo, efficienza energetica)."
    en: "**Electrical drives & energy:** Electric Drives for the Energy Transition (electrical machines and their control, energy efficiency)."
  - it: "**Dinamica:** Mechanical Vibrations (analisi modale, funzioni di risposta in frequenza, vibrazioni random, dinamica non lineare), modellazione di sistemi multibody e meccatronici."
    en: "**Dynamics:** Mechanical Vibrations (modal analysis, frequency response functions, random vibrations, nonlinear dynamics), Multibody and mechatronic system modelling."

projects:
  - title:
      it: Kernel CNC real-time in architettura multi-agente
      en: Real-time CNC kernel in a multi-agent architecture
    dates: 2026
    place:
      it: Progetto del corso di Digital Manufacturing – LM in Mechatronics Engineering, Università di Trento
      en: Course project, Digital Manufacturing – M.Sc. in Mechatronics Engineering, University of Trento
    bullets:
      - it: Sviluppo in C++ moderno (C++20, CMake) di un kernel CNC che interpreta il G-code ISO e genera in tempo reale i comandi di moto per la macchina.
        en: Development in modern C++ (C++20, CMake) of a CNC kernel that parses ISO G-code and generates the motion commands for the machine in real time.
      - it: Integrazione nel framework distribuito multi-agente MADS (Prof. P. Bosetti); il kernel scambia dati in rete con una Functional Mock-up Unit (FMU) che simula la macchina utensile e con un visualizzatore della macchina.
        en: "Integration into the MADS multi-agent distributed framework (Prof. P. Bosetti): the kernel exchanges data over the network with a Functional Mock-up Unit (FMU) simulating the machine tool and with a machine visualizer."

