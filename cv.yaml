projects:
  - title:
      it: Kernel CNC real-time in architettura multi-agente
      en: Real-time CNC kernel in a multi-agent architecture
    dates: 2026
    place:
      it: Progetto del corso di Digital Manufacturing – LM in Mechatronics Engineering, Università di Trento
      en: Course project, Digital Manufacturing – M.Sc. in Mechatronics Engineering, University of Trento
    bullets:
      - it: Sviluppo in C++ moderno (C++20, CMake) di un kernel CNC che interpreta il G-code ISO e genera in tempo reale i comandi di moto per la macchina.
        en: Development in modern C++ (C++20, CMake) of a CNC kernel that parses ISO G-code and generates the motion commands for the machine in real time.
      - it: Integrazione nel framework distribuito multi-agente MADS (Prof. P. Bosetti); il kernel scambia dati in rete con una Functional Mock-up Unit (FMU) che simula la macchina utensile e con un visualizzatore della macchina.
        en: "Integration into the MADS multi-agent distributed framework (Prof. P. Bosetti): the kernel exchanges data over the network with a Functional Mock-up Unit (FMU) simulating the machine tool and with a machine visualizer."

  - title:
      it: Challenge ECIU MASSMa II – Multi-Agent Systems for Smart Machining
      en: ECIU Challenge MASSMa II – Multi-Agent Systems for Smart Machining
    dates: 2026
    place:
      it: Corso internazionale ECIU, con una settimana in presenza a Tolosa (Francia)
      en: ECIU international course, with an on-site week in Toulouse (France)
    bullets:
      - it: Raccolta ed elaborazione dei dati di lavorazione per migliorare le prestazioni energetiche e produttive.
        en: Collection and processing of machining data to improve energy and production performance.

  - title:
      it: Stima dello stato per robot mobili da odometria e lidar
      en: State estimation for mobile robots from odometry and lidar
    dates: {it: in corso, en: ongoing}
    bullets:
      - it: "Progetto in team del corso Robotic Perception and Action: stima dello stato che integra odometria e lidar."
        en: "Team project, Robotic Perception and Action course: state estimation integrating odometry and lidar."

  - title:
      it: Lettura dei pettorali su sistema embedded a bassissimo consumo
      en: Bib number reading on an ultra-low-power embedded system
    dates: {it: in avvio, en: starting}
    bullets:
      - it: Progetto in team – sistema embedded a batteria con fotocamera e TinyML per leggere i pettorali all'arrivo delle gare.
        en: Team project – battery-powered embedded system (camera, TinyML) reading bib numbers at race finish lines.

